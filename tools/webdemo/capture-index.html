<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/xterm.css">
<script src="coi-serviceworker.js"></script>
<script src="assets/xterm.js"></script><script src="assets/xterm-pty.js"></script><script src="assets/wasm-ring.js"></script>
</head><body><div id="terminal"></div>
<script>
const term=new Terminal({cols:100,rows:40,convertEol:true,scrollback:2000});
term.open(document.getElementById('terminal')); window.__ovmxTerm=term;
// rd vms-e79: two qemu-wasm builds. A WASMFS glue (its out.js announces wasmring
// buffers via Module.ovmxRing) has the console on a shared-memory ring; the JS FS
// glue has it on xterm-pty's TTY. Which one is here is read off out.js itself.
let slave=null, ring=null;
const glue=fetch('out.js').then(r=>r.text()).then(t=>/ovmxRing/.test(t));
async function gz(u){const r=await fetch(u);const s=r.body.pipeThrough(new DecompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer());}
function startQemu(RINGS){
if(RINGS){ring=OVMXWasmRing.bridge({onOut:b=>term.write(b)});term.onData(d=>ring.consoleIn(d));}
else{const p=openpty();slave=p.slave;term.loadAddon(p.master);}
window.Module={
  arguments:[...(RINGS?OVMXWasmRing.CONSOLE_ARGS:['-nographic']),'-M','pc','-m','256M','-accel','tcg,tb-size=500','-L','/pack-rom/','-nic','none',
    '-kernel','/pack-kernel/vmlinuz','-initrd','/pack-initramfs/initramfs-ovmx.cpio.gz','-append','console=ttyS0',
    '-drive','file=/pack-disk/sysdisk.qcow2,format=qcow2,if=virtio','-no-reboot'],
  locateFile:p=>new URL(p,document.baseURI).href,
  mainScriptUrlOrBlob:new URL('out.js',document.baseURI).href,
  pty:slave,
  ovmxRing:(...a)=>{if(ring)ring.onRing(...a);},
  preRun:[m=>{m.addRunDependency('p');
    Promise.all([fetch('vmlinuz').then(r=>r.arrayBuffer()),fetch('initramfs-ovmx.cpio.gz').then(r=>r.arrayBuffer()),gz('sysdisk.qcow2.gz')])
     .then(([k,i,d])=>{for(const x of ['pack-kernel','pack-initramfs','pack-disk'])m.FS.createPath('/',x,true,true);
       m.FS.createDataFile('/pack-kernel','vmlinuz',new Uint8Array(k),true,true,true);m.FS.createDataFile('/pack-initramfs','initramfs-ovmx.cpio.gz',new Uint8Array(i),true,true,true);
       m.FS.createDataFile('/pack-disk','sysdisk.qcow2',d,true,true,true);m.removeRunDependency('p');});}],
  onRuntimeInitialized:()=>{window.__ovmxMod=Module;if(RINGS)return;const op=Module.TTY.stream_ops.poll,pty=Module.pty;
    Module.TTY.stream_ops.poll=function(s,t){if(!pty.readable)return (pty.readable?1:0)|(pty.writable?4:0);return op.call(s,s,t);};}
};
const load=src=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.body.appendChild(e);});
return load('load-rom.js').then(()=>load('out.js'));
}
glue.then(startQemu);
</script>
</body></html>
