name: track-cluster-demo

# Redeploy the 3-node browser cluster demo (demo/cluster/) for a vms release
# tag, GATED by the visitor matrix (rd vms-cdbd, vms-f0f, vms-db1).
#
# Runs after every completed track-release.yml run (workflow_run): that
# workflow already polls the vms tags every 10 minutes and deploys boot/ for a
# new tag, so a new release reaches this workflow with no token and no secret.
# The repository_dispatch (release-tagged) vms #1284 sends after a tag is
# published is an optional speed-up (a silent no-op on the vms side without
# its token), and workflow_dispatch runs it by hand. Never inline in vms's
# release.yml, so a demo failure can never block or hold a release tag.
#
# WHAT IT REBUILDS. Node A (OVMX/x86, qemu-wasm) is rebuilt from the tag by
# vms's tools/cluster-web-demo/build-cluster-demo and deployed IN PLACE at
# demo/cluster/nodeA/, with node-worker.js's BOOT_VER/PAYLOAD_VER moved to the
# tag so a returning visitor cannot pair a cached payload with the new kernel.
# Node B (OVMX/VAX) and Node C (the pinned real VAX/VMS V7.3 volume) are served
# from the pcjs deploy at vax.3dl.network and are NOT rebuilt here: Node B's
# per-tag image lands in that repo. The gate below boots whatever Node B/C the
# page embeds, so it proves the combination a visitor will actually get.
#
# THE GATE. Node A's new payload is NOT committed unless every row of the
# visitor matrix (vms tools/cluster-web-demo/gate-eval.mjs MATRIX) passes
# against a local preview of the page carrying it: CN=3 with the real VAX
# admitting both OVMX nodes, a quiet OVMX/VAX console, and every node -- the
# real VAX included -- offering Username: and a logged-in DCL $ (rd vms-db1).
# The OVMX nodes log in with the homepage's published hint; the real VAX is
# never logged in to -- it passes on offering Username:, the proof its startup
# completed -- so the gate needs no secret. On a failed gate (or build) the demo
# honestly stays where it is, pinned in demo/cluster/CLUSTER_DEMO_PIN.json with
# the reason.
#
# The boot/ assets (kernel + qemu-wasm runtime) are track-release.yml's: the
# cluster node's vms.ko must match boot/vmlinuz, so this workflow runs only
# once boot/DEPLOYED_TAG is the tag being deployed, and fails honestly
# otherwise rather than pair a new node with an old kernel.

on:
  workflow_run:
    workflows: [track-release]
    types: [completed]
  repository_dispatch:
    types: [release-tagged]
  workflow_dispatch:
    inputs:
      tag:
        description: 'vms release tag to deploy the cluster demo for (e.g. V0.7-9)'
        required: true
      force:
        description: rebuild + re-gate even if demo/cluster/DEPLOYED_TAG already matches
        type: boolean
        default: false
      ref:
        description: 'PREFLIGHT ONLY: vms branch/commit to build and gate instead of the tag (e.g. release-verify-v0.7-10) -- the visitor matrix BEFORE a tag'
        required: false
        default: ''
      preflight:
        description: 'run the visitor matrix against `ref` (Node A built from source) and report only: no deploy, no pin, no commit'
        type: boolean
        default: false

permissions:
  contents: write

# A preflight (a vms ref gated before its tag) deploys nothing, so it runs in a
# group of its own: in the shared group, the track-release cascade that fires
# every 10 minutes replaced it while it was still pending.
concurrency: ${{ github.event.inputs.preflight == 'true' && format('cluster-demo-preflight-{0}', github.run_id) || 'track-cluster-demo' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      src: ${{ steps.r.outputs.src }}
      preflight: ${{ steps.r.outputs.preflight }}
      skip: ${{ steps.r.outputs.skip }}
      cases: ${{ steps.m.outputs.cases }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: r
        run: |
          TAG='${{ github.event.inputs.tag || github.event.client_payload.tag }}'
          # After track-release (workflow_run), the tag is the one boot/ is now
          # on: that workflow just deployed it (or found it current).
          [ -n "$TAG" ] || TAG=$(cat boot/DEPLOYED_TAG 2>/dev/null || true)
          [ -n "$TAG" ] || { echo "no tag (no input, no dispatch payload, no boot/DEPLOYED_TAG)."; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # PREFLIGHT (rd vms-f4e follow-up: the gate ran only after a tag, so
          # V0.7-9 went public crashing a VAX): build and gate a vms REF before
          # it is tagged. Nothing is deployed or pinned, so the deployed-tag,
          # pin and boot-tag checks below do not apply.
          if [ "${{ github.event.inputs.preflight }}" = "true" ]; then
            REF='${{ github.event.inputs.ref }}'
            [ -n "$REF" ] || { echo "preflight needs a ref"; exit 1; }
            echo "src=$REF" >> "$GITHUB_OUTPUT"
            echo "preflight=1" >> "$GITHUB_OUTPUT"
            echo "PREFLIGHT: gating vms $REF as $TAG (no deploy, no pin)"; exit 0
          fi
          echo "src=$TAG" >> "$GITHUB_OUTPUT"
          DEPLOYED=$(cat demo/cluster/DEPLOYED_TAG 2>/dev/null || true)
          if [ "$TAG" = "$DEPLOYED" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "cluster demo already on $TAG."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A tag whose redeploy already failed its gate is pinned, not retried
          # on every track-release poll; workflow_dispatch force=true retries it.
          if [ "${{ github.event.inputs.force }}" != "true" ] \
             && python3 -c "import json,sys; p=json.load(open('demo/cluster/CLUSTER_DEMO_PIN.json')); sys.exit(0 if p.get('blocked_from')=='$TAG' else 1)" 2>/dev/null; then
            echo "cluster demo is pinned against $TAG (demo/cluster/CLUSTER_DEMO_PIN.json) -- not retried; dispatch with force=true to retry."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BOOT=$(cat boot/DEPLOYED_TAG 2>/dev/null || true)
          [ "$BOOT" = "$TAG" ] || {
            echo "boot/ is at '$BOOT', not $TAG: track-release.yml deploys the kernel first, and Node A's vms.ko must match it. Re-run once it has."; exit 1; }

      - name: Check out vms at the tag (generator, injectors, node-identity SSOT, visitor gate)
        if: steps.r.outputs.skip != '1'
        run: git clone --depth 1 --branch "${{ steps.r.outputs.src }}" https://github.com/3dl-dev/vms vmssrc

      - name: The visitor matrix this tag's gate defines
        id: m
        if: steps.r.outputs.skip != '1'
        run: |
          cd vmssrc/tools/cluster-web-demo
          echo "cases=$(node -e "import('./gate-eval.mjs').then(m=>console.log(JSON.stringify(m.MATRIX.map(r=>r.label))))")" >> "$GITHUB_OUTPUT"

      - name: Obtain this tag's x86 boot assets (published Release, else build from source)
        if: steps.r.outputs.skip != '1'
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          T='${{ steps.r.outputs.tag }}'; mkdir -p rel
          if [ "${{ steps.r.outputs.preflight }}" != "1" ] && gh release download "$T" --repo 3dl-dev/vms -D rel \
               -p vmlinuz -p initramfs-ovmx-slim.cpio.gz -p ovmx-distrib.img 2>/dev/null \
             && [ -f rel/ovmx-distrib.img ]; then
            echo "using PUBLISHED release assets for $T"
          else
            echo "no release assets for $T -- building the bootable image from source"
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
            ( cd vmssrc && docker build -f distro/Dockerfile.bootable -t ovmx-boot . )
            cid=$(docker create ovmx-boot)
            docker cp "$cid:/boot/vmlinuz" rel/vmlinuz
            docker cp "$cid:/boot/initramfs-ovmx-slim.cpio.gz" rel/initramfs-ovmx-slim.cpio.gz
            docker cp "$cid:/boot/ovmx-distrib.img" rel/ovmx-distrib.img
            docker rm "$cid" >/dev/null
          fi

      - name: Install qemu-img (the generator's ODS-2/qcow2 conversion dependency)
        if: steps.r.outputs.skip != '1'
        run: sudo apt-get update && sudo apt-get install -y qemu-utils

      - name: Build Node A for the tag (build-cluster-demo)
        if: steps.r.outputs.skip != '1'
        run: |
          set -e
          T='${{ steps.r.outputs.tag }}'
          chmod +x vmssrc/tools/cluster-web-demo/build-cluster-demo
          vmssrc/tools/cluster-web-demo/build-cluster-demo "$T" \
            --out "$RUNNER_TEMP/demo-out" \
            --x86-vmlinuz rel/vmlinuz \
            --x86-initramfs rel/initramfs-ovmx-slim.cpio.gz \
            --x86-sysdisk rel/ovmx-distrib.img \
            --site-dir "$PWD" \
            --boot-dir "$PWD/boot"
          mkdir -p payload/nodeA
          cp "$RUNNER_TEMP/demo-out/$T/nodeA/initramfs-ovmx-nodeA.cpio.gz" payload/nodeA/
          cp "$RUNNER_TEMP/demo-out/$T/nodeA/sysdisk-nodeA.qcow2.gz" payload/nodeA/
          cp "$RUNNER_TEMP/demo-out/$T/manifest.json" payload/manifest.json

      - uses: actions/upload-artifact@v4
        if: steps.r.outputs.skip != '1'
        with:
          name: cluster-demo-payload
          path: payload/

  gate:
    needs: build
    if: needs.build.outputs.skip != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.build.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: cluster-demo-payload, path: payload }

      - name: Stage the preview (the page as it will be deployed)
        run: |
          T='${{ needs.build.outputs.tag }}'
          cp payload/nodeA/* demo/cluster/nodeA/
          sed -i "s/^const BOOT_VER  = '[^']*'/const BOOT_VER  = '$(echo "$T" | tr 'V' 'v')'/; s/^const PAYLOAD_VER = '[^']*'/const PAYLOAD_VER = '$T'/" \
            demo/cluster/node-worker.js
          grep -n "BOOT_VER  =\|PAYLOAD_VER =" demo/cluster/node-worker.js

      - name: Check out vms at the tag (the visitor gate) -- or the preflight ref
        run: git clone --depth 1 --branch "${{ needs.build.outputs.src }}" https://github.com/3dl-dev/vms vmssrc

      - name: Install the gate's browser
        run: |
          cd vmssrc/tools/cluster-web-demo
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Visitor gate -- ${{ matrix.case }}
        run: |
          node demo/cluster/e2e/coi-server.js "$PWD" 8123 &
          sleep 2
          cd vmssrc/tools/cluster-web-demo
          CASE='${{ matrix.case }}' \
          DEMO_URL=http://localhost:8123/demo/cluster/ \
          DEMO_LOGIN_HINT_URL=http://localhost:8123/ \
          OUT_DIR="$RUNNER_TEMP/gate" \
            node visitor-gate.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visitor-gate-${{ matrix.case }}
          path: ${{ runner.temp }}/gate/

  deploy:
    needs: [build, gate]
    if: always() && needs.build.outputs.skip != '1' && needs.build.result != 'skipped' && needs.build.outputs.preflight != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success' && needs.gate.result == 'success'
        with: { name: cluster-demo-payload, path: payload }

      - name: Deploy Node A for the tag (the gate passed)
        if: needs.build.result == 'success' && needs.gate.result == 'success'
        run: |
          T='${{ needs.build.outputs.tag }}'
          cp payload/nodeA/* demo/cluster/nodeA/
          sed -i "s/^const BOOT_VER  = '[^']*'/const BOOT_VER  = '$(echo "$T" | tr 'V' 'v')'/; s/^const PAYLOAD_VER = '[^']*'/const PAYLOAD_VER = '$T'/" \
            demo/cluster/node-worker.js
          git rm -q --ignore-unmatch demo/cluster/CLUSTER_DEMO_PIN.json
          echo "$T" > demo/cluster/DEPLOYED_TAG
          git config user.name 'ovmx-release-bot'; git config user.email 'bot@3dl.dev'
          git add demo/cluster
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "demo/cluster: redeploy Node A at ${T}, visitor gate passed (rd vms-cdbd, vms-db1)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push $i rejected, retrying"; sleep 5
          done
          echo "push failed after retries"; exit 1

      - name: Honest pin (the build or the visitor gate failed)
        if: needs.build.result != 'success' || needs.gate.result != 'success'
        run: |
          T='${{ needs.build.outputs.tag || github.event.inputs.tag || github.event.client_payload.tag }}'
          DEPLOYED=$(cat demo/cluster/DEPLOYED_TAG 2>/dev/null || echo unknown)
          REASON="cluster-demo redeploy for ${T} did not pass (build=${{ needs.build.result }}, visitor gate=${{ needs.gate.result }}) on $(date -u +%Y-%m-%d); run ${{ github.run_id }}. The demo stays at ${DEPLOYED}."
          python3 -c 'import json,sys; json.dump({"pinned_to":sys.argv[1],"blocked_from":sys.argv[2],"reason":sys.argv[3]}, open("demo/cluster/CLUSTER_DEMO_PIN.json","w"), indent=2)' "$DEPLOYED" "$T" "$REASON"
          git config user.name 'ovmx-release-bot'; git config user.email 'bot@3dl.dev'
          git add demo/cluster/CLUSTER_DEMO_PIN.json
          if git diff --cached --quiet; then echo "pin already current"; exit 0; fi
          git commit -m "demo/cluster: stays at ${DEPLOYED} -- ${T} redeploy did not pass its gate"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "pin push $i rejected, retrying"; sleep 5
          done
          echo "pin push failed after retries"
          exit 1
