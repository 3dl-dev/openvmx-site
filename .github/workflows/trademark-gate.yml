name: trademark-gate

# Trademark hygiene gate (operator ruling 2026-08-13). The string "OpenVMS"
# must NOT appear in any tracked *.html outside docs/ — not in the <title>,
# meta tags, headings, or body copy. Compatibility is carried through DCL / RMS
# / VAX / Alpha / DECnet vocabulary and DEC heritage framing, never by leading
# with a mark we do not own. This job FAILS the build if the term regresses,
# so the site can never silently drift back to naming it.

on:
  push:
  pull_request:

jobs:
  no-openvms:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fail if "OpenVMS" appears in any tracked *.html (excluding docs/)
        run: |
          # All tracked HTML except under docs/ (docs may quote the term in prose).
          FILES=$(git ls-files '*.html' ':!:docs/**')
          echo "scanning:"; echo "$FILES"
          # ONE exemption (Baron, 2026-10-14), by exact path AND content hash:
          # the cluster demo's vendored pcjs machine page (third-party emulator
          # code, pinned in demo/cluster/pcjs/PIN.json). Its "OpenVMS" hits are
          # code comments and the regex that recognises the REAL VAX/VMS boot
          # banner on Node C's console -- not site copy. A pcjs bump changes the
          # hash, so the exemption lapses and the gate fails until someone
          # re-reviews the new file and records its hash here.
          EXEMPT_PATH=demo/cluster/pcjs/machines/dec/vax/browser/ovmx-cluster.html
          EXEMPT_SHA256=99ab5ab08105ae3038eacb2cca13656ab912cf5200506e40ec0d5db7cca49c9e
          bad=0
          for f in $FILES; do
            if [ "$f" = "$EXEMPT_PATH" ] && [ "$(sha256sum "$f" | cut -d' ' -f1)" = "$EXEMPT_SHA256" ]; then
              echo "exempt (reviewed vendored pcjs page, sha256 $EXEMPT_SHA256): $f"
              continue
            fi
            n=$(grep -c 'OpenVMS' "$f" || true)
            if [ "$n" -gt 0 ]; then
              echo "::error file=$f::found $n occurrence(s) of 'OpenVMS' — banned as identity/copy (see trademark-gate.yml)"
              grep -n 'OpenVMS' "$f" || true
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "trademark-gate FAILED: strip 'OpenVMS' from the flagged file(s)."
            exit 1
          fi
          echo "trademark-gate PASSED: no 'OpenVMS' in tracked *.html outside docs/."
